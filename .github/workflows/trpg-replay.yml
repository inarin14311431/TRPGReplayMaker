name: TRPG replay addon tests
on:
  push:
    paths:
      - 'packages/trpg-replay/**'
      - '.github/workflows/trpg-replay.yml'
  pull_request:
    paths:
      - 'packages/trpg-replay/**'
      - '.github/workflows/trpg-replay.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: packages/trpg-replay
